name: web CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node --check server.mjs
      - run: node --check backend/api.generated.mjs
      - run: npm run smoke
      - run: docker build -t noqeri-web:test .
