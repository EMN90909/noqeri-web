name: web CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Build Noqeri compiler used by the site
        run: |
          git clone --depth 1 https://github.com/EMN90909/Noqeri.git /tmp/Noqeri
          cmake -S /tmp/Noqeri -B /tmp/Noqeri/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/Noqeri/build -j2
      - name: Generate .nqo backend and client artifacts
        run: |
          /tmp/Noqeri/build/noqeri web backend/api.nqr backend/api.generated.nqo
          /tmp/Noqeri/build/noqeri web src/noqeri/client.nqr src/noqeri/client.generated.nqo
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node --check server.mjs
      - run: node --input-type=module --check < backend/api.generated.nqo
      - run: node --input-type=module --check < src/noqeri/client.generated.nqo
      - run: NOQERI_BIN=/tmp/Noqeri/build/noqeri npm run smoke
      - run: docker build -t noqeri-web:test .
