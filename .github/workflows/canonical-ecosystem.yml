name: Canonical website integration
on:
  pull_request:
  push:
    branches: [integration/canonical-ecosystem-v1]
permissions:
  contents: read
jobs:
  registry-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:packages
      - run: npm run build
